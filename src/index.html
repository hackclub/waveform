<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waveform</title>

    <link rel="stylesheet" href="css/index.css">

    <!-- opengraph -->
    <meta property="og:title" content="waveform">
    <meta property="og:type" content="website">
    <meta property="og:description" content="waveform was a hack club event where you built an audio visualizer and got a grant for music (summer 2025)">
    <meta property="og:image" content="/public/thumb.png">
    <meta property="og:url" content="https://waveform.hackclub.com">

    <link rel="icon" type="image/x-icon" href="./public/favicon.png">
</head>

<body>
    <div id="overlay">
        <p>loading...</p>
    </div>
    <div id="overlay2">
        <p>click to start (plays audio)</p>
    </div>
    <div id="mute">
        <p>mute</p>
    </div>
    <div id="content">
        <p>build an audio visualizer, get a grant for music</p>
        <p>this event has ended! thanks for participating (summer 2025)</p>

        <div class="instructions">
            <p>check out the <a class="rainbow link" href="/tutorial">waveform tutorial</a> to learn how to build your own audio visualizer</p>
        </div>
        <div id="gallery">
            <a class="gallery-img" href="https://audiovisualthing.netlify.app/" rel="noopener noreferrer">
                <img class="gallery-img"  src="https://hc-cdn.hel1.your-objectstorage.com/s/v3/0d406248a2318615b4f4f2794f2ee15692ae38b8_image.png" alt="fractal">
            </a>
            <img class="gallery-img" src="./public/3waveform.png" alt="waveform">
            <a class="gallery-img" href="https://jeremyseq.github.io/WaveformProject/">
                <img class="gallery-img" src="https://hc-cdn.hel1.your-objectstorage.com/s/v3/acd82d21df869f0d5d16f46c11deb1542dfba00c_image.png">
            </a>
        </div>
        <p id="footer">made with love by hackclub</p>
    </div>
    <p id="hide">hide</p>
    <script>
        document.body.style.visibility = 'hidden';
    </script>
    <canvas id="waveform" width="640" height="320"></canvas>
    <script type="module" src="./js/main.js"></script>
</body>

</html>
